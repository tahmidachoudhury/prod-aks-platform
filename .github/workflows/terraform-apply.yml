name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: prod

    # Prevents two pipelines from running simultaneously and one being cancelled
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./infra/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init -reconfigure

      - name: Terraform Plan
        run: |
          set +e
          terraform plan \
            -var-file=envs/dev.tfvars \
            -out=tfplan
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then
            echo "Terraform plan failed with error"
            exit 1
          fi
          exit 0

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        run: terraform output
        continue-on-error: true

  health-check:
    name: Post-Deploy Health Check
    needs: terraform-apply
    runs-on: ubuntu-latest

    steps:
      - name: Check application endpoint
        run: |
          URL="https://2048.azure.tahmidchoudhury.uk"
          MAX_RETRIES=10

          for i in $(seq 1 $MAX_RETRIES); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [ "$CODE" = "200" ]; then
              echo "Endpoint healthy (HTTP $CODE)"
              exit 0
            fi

            echo "Attempt $i/$MAX_RETRIES: HTTP $CODE"
            sleep 30
          done

          echo "Endpoint did not become healthy after $MAX_RETRIES attempts"
          exit 1
