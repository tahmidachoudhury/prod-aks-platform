apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-2048
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/tahmidachoudhury/prod-aks-platform.git
    targetRevision: main
    path: gitops/2048-app
  destination:
    server: https://kubernetes.default.svc
    namespace: app-2048
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
